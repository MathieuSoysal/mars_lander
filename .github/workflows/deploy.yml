name: Deploy

on:
  push:
    branches:
      - master

# Add explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install terser html-minifier postcss postcss-cli cssnano-cli

      - name: Minify JavaScript
        run: |
          for file in js/*.js; do
            npx terser "$file" -o "$file.min.js" && mv "$file.min.js" "$file"
          done

      - name: Minify HTML
        run: npx html-minifier --collapse-whitespace --remove-comments --minify-css true --minify-js true -o index.min.html index.html && mv index.min.html index.html

      - name: Minify CSS
        run: npx cssnano-cli styles.css styles.min.css && mv styles.min.css styles.css

      - name: Prepare deployment directory
        run: |
          mkdir -p dist
          cp -r index.html styles.css js/ pkg/ favicon/ site.webmanifest dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
