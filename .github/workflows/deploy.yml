name: Deploy

on:
  push:
    branches:
      - master

# Add explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install terser html-minifier postcss postcss-cli cssnano-cli

      - name: Minify JavaScript
        run: |
          for file in js/*.js; do
            npx terser "$file" -o "$file.min.js" && mv "$file.min.js" "$file"
          done

      - name: Minify HTML
        run: npx html-minifier --collapse-whitespace --remove-comments --minify-css true --minify-js true -o index.min.html index.html && mv index.min.html index.html

      - name: Minify CSS
        run: npx cssnano-cli styles.css styles.min.css && mv styles.min.css styles.css

      - name: Prepare deployment directory
        run: |
          mkdir -p dist
          cp index.html styles.css site.webmanifest dist/ || true
          # Copy directories only if they exist
          [ -d "js" ] && cp -r js/ dist/ || echo "js directory not found, skipping"
          [ -d "pkg" ] && cp -r pkg/ dist/ || echo "pkg directory not found, skipping"
          [ -d "favicon" ] && cp -r favicon/ dist/ || echo "favicon directory not found, skipping"
          
          # Ensure we have the WASM files in the dist directory
          if [ ! -d "dist/pkg" ] && [ -d "target/wasm32-unknown-unknown/release" ]; then
            mkdir -p dist/pkg
            cp -r target/wasm32-unknown-unknown/release/*.wasm dist/pkg/ || true
          fi
          
          # Make sure the dist directory has content
          find dist -type f | head -n 5

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
