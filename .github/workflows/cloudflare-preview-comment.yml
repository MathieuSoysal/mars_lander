name: Cloudflare Pages Preview Comment

on:
  deployment_status:

jobs:
  comment:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Find associated PR and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.deployment.sha,
            });
            if (prs.length === 0) return;
            const pr = prs[0];
            const previewUrl = context.payload.deployment_status.environment_url;
            const marker = '<!-- cloudflare-preview-comment -->';
            const body = `${marker}\n## 🚀 Cloudflare Pages Preview\nPreview URL: ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
