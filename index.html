<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
  <title>Mars Lander Viewer</title>

  <!-- Resource hints for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="dns-prefetch" href="//fonts.gstatic.com">

  <!-- Preload critical assets -->
  <style>
    /* Critical CSS for above-the-fold content */
    :root {
      --primary-color: #00f6ff;
      --secondary-color: #0062c4;
      --background-dark: #000824;
      --background-light: #0a1550;
      --text-bright: #e6fbff;
      --text-primary: #ffffff;
      --accent-color: #ff2a8d;
      --border-glow: 0 0 15px var(--primary-color);
      --input-bg: rgba(1, 22, 59, 0.7);
      --dashboard-width: 350px;
      --holographic-gradient: linear-gradient(135deg, rgba(0, 246, 255, 0.15), rgba(255, 42, 141, 0.08));
      --grid-color: rgba(0, 246, 255, 0.1);
    }

    @media (max-width: 1300px) {
      :root {
        --dashboard-width: 100%;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: var(--background-dark);
      color: var(--text-primary);
      line-height: 1.6;
      height: 100dvh;
      overflow: hidden;
      font-size: 16px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(0, 246, 255, 0.03) 0%, transparent 60%),
        radial-gradient(circle at 90% 80%, rgba(255, 42, 141, 0.03) 0%, transparent 40%);
    }

    header {
      background-color: rgba(0, 8, 36, 0.7);
      color: white;
      padding: 15px 25px;
      box-shadow: 0 0 20px rgba(0, 246, 255, 0.2);
      border-bottom: 1px solid rgba(0, 246, 255, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }

    h1 {
      font-size: 24px;
      font-weight: 300;
      color: var(--text-bright);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 246, 255, 0.6);
    }

    .main-container {
      display: flex;
      height: calc(100svh - 120px)
    }

    .viewer-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #svg-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      aspect-ratio: 7/3;
    }

    .fonts-loaded h1,
    .fonts-loaded h2,
    .fonts-loaded h3,
    .fonts-loaded .dashboard-header,
    .fonts-loaded .button-text {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .fonts-loaded {
      animation: text-focus 0.2s ease-out forwards;
    }

    @keyframes text-focus {
      0% {
        opacity: 0.98;
      }

      100% {
        opacity: 1;
      }
    }
  </style>

  <!-- Non-blocking CSS loading -->
  <link rel="stylesheet" href="styles.css" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="styles.css">
  </noscript>

  <!-- Optimized font loading with display swap -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'" crossorigin>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  </noscript>

  <!-- Favicon with cache control -->
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico?v=1.0.0">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png?v=1.0.0">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png?v=1.0.0">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png?v=1.0.0">
  <link rel="manifest" href="site.webmanifest?v=1.0.0">

  <meta name="theme-color" content="#000824">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description"
    content="Mars Lander Viewer - A futuristic simulation environment for Mars landing missions.">
  <meta name="keywords" content="Mars, Lander, Simulation, Genetic Algorithm, Space, Mission Control">
  <meta name="author" content="Mathieu Soysal">
  <meta name="robots" content="index, follow">
  <meta name="revisit-after" content="1 days">

  <!-- Cache control - Note: Should be implemented server-side as well -->
  <meta http-equiv="Cache-Control" content="public, max-age=31536000, must-revalidate">

  <!-- Improved font loading strategy -->
  <script>
    // Flag for tracking font loading state
    let fontsLoaded = false;

    // Function to apply the fonts-loaded class
    function markFontsAsLoaded() {
      if (!fontsLoaded) {
        document.documentElement.classList.add('fonts-loaded');
        fontsLoaded = true;
      }
    }

    // Check if Font Loading API is supported
    if ('fonts' in document) {
      Promise.all([
        document.fonts.load('300 1em Roboto'),
        document.fonts.load('400 1em Roboto'),
        document.fonts.load('500 1em Roboto')
      ]).then(markFontsAsLoaded)
        .catch(() => {
          setTimeout(markFontsAsLoaded, 1000);
        });

      document.fonts.addEventListener('loadingdone', markFontsAsLoaded);
    } else {
      setTimeout(markFontsAsLoaded, 1000);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !fontsLoaded) {
        markFontsAsLoaded();
      }
    });

    window.addEventListener('load', () => {
      setTimeout(markFontsAsLoaded, 100);
    });
  </script>
</head>

<body>
  <header>
    <h1>Mars Lander Viewer</h1>
  </header>

  <div class="main-container">
    <div class="viewer-container">
      <div id="svg-container">
        <div class="scanner-overlay"></div>
        <div class="grid-overlay"></div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7000 3000" width="100%" height="100%">
          <defs>
            <radialGradient id="marsGlow" cx="50%" cy="100%" r="70%" fx="50%" fy="100%">
              <stop offset="0%" stop-color="rgba(255, 60, 0, 0.2)" />
              <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
            </radialGradient>

            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <rect width="100%" height="100%" fill="black"></rect>

          <rect x="0" y="2500" width="7000" height="500" fill="url(#marsGlow)" opacity="0.7"></rect>

          <line x1="0" y1="1500" x2="1000" y2="1000" stroke="#ff3300" stroke-width="7" filter="url(#glow)"></line>
          <line x1="1000" y1="1000" x2="2000" y2="2500" stroke="#ff3300" stroke-width="7" filter="url(#glow)"></line>
          <line x1="3500" y1="2500" x2="5000" y2="1500" stroke="#ff3300" stroke-width="7" filter="url(#glow)"></line>
          <line x1="5000" y1="1500" x2="6999" y2="2000" stroke="#ff3300" stroke-width="7" filter="url(#glow)"></line>
          <line x1="2000" y1="2500" x2="3500" y2="2500" stroke="#00ff9d" stroke-width="8" filter="url(#glow)">
            <title>Landing Zone</title>
            <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
          </line>

          <g>
          </g>
        </svg>
      </div>

      <div class="player-controls">
        <button id="prev" class="player-button"><span>⏮</span></button>
        <button id="play-pause" class="player-button">
          <span class="play-icon">▶</span>
          <span class="pause-icon hidden">⏸</span>
        </button>
        <button id="next" class="player-button"><span>⏭</span></button>

        <div class="speed-control-compact">
          <span class="speed-label">Speed</span>
          <input type="range" id="speed-compact" min="1" max="10" value="10" class="speed-slider">
          <span id="speed-value">10x</span>
        </div>

        <div class="mini-progress-container">
          <div class="mini-progress-bar">
            <div id="mini-progress" class="mini-progress-fill"></div>
          </div>
          <span id="progress-text">0%</span>
        </div>
      </div>

      <div id="counter">1 / 300</div>
      <div id="loader" class="loader hidden"></div>
    </div>

    <button id="dashboard-toggle" class="dashboard-toggle hidden">
      <span class="open-icon">⚙️</span>
      <span class="close-icon hidden">✕</span>
    </button>

    <div class="dashboard futuristic">
      <div class="dashboard-header">
        <h2>Mission Control</h2>
        <div class="glow-line"></div>
      </div>

      <div class="dashboard-section">
        <h3>Simulation Environment</h3>
        <div class="param-group">
          <label for="map-selection">Map Selection: <button type="button" class="info-button"
              data-info="Choose from different terrain configurations for the simulation">i</button></label>
          <select id="map-selection">
            <option value="default">Default Map</option>
            <option value="canyon">Deep Canyon</option>
            <option value="mountain">Mountain Range</option>
            <option value="plateau">High Plateau</option>
            <option value="valley">Narrow Valley</option>
          </select>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Genetic Algorithm Configuration</h3>
        <form id="ga-params">
          <div class="param-group">
            <label for="population-size">Population Size:</label>
            <input type="number" id="population-size" min="10" max="1000" value="100">
          </div>

          <div class="param-group">
            <label for="generation-count">Number of Generations:</label>
            <input type="number" id="generation-count" min="1" max="1000" value="200">
          </div>

          <div class="param-group">
            <label for="selection-mode">Selection Mode:</label>
            <select id="selection-mode">
              <option value="tournament">Tournament</option>
              <option value="roulette">Roulette Wheel</option>
              <option value="rank">Rank-based</option>
            </select>
          </div>

          <div class="param-group">
            <label for="elite-rate">Elite rate: <button type="button" class="info-button"
                data-info="Percentage of best individuals that automatically survive to next generation unchanged">i</button></label>
            <input type="range" id="elite-rate" min="0" value="20" max="100">
            <span id="elite-rate-value">20%</span>
          </div>

          <div class="param-group">
            <label for="crossover-rate">Crossover Rate: <button type="button" class="info-button"
                data-info="Probability of genetic crossover between parents - controls how much genetic material is exchanged">i</button></label>
            <input type="range" id="crossover-rate" min="0" max="100" value="90">
            <span id="crossover-rate-value">90%</span>
          </div>

          <div class="param-group">
            <label for="mutation-rate">Mutation Rate: <button type="button" class="info-button"
                data-info="Probability of random mutations - higher values increase diversity but may disrupt good solutions">i</button></label>
            <input type="range" id="mutation-rate" min="0" max="100" value="10">
            <span id="mutation-rate-value">10%</span>
          </div>

          <div class="button-container">
            <button type="button" id="run-ga" class="primary-button">
              <span class="button-text">Run Algorithm</span>
              <span class="button-glow"></span>
              <span class="holographic-scan"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="seek-container">
    <input type="range" id="seek" min="1" max="300" value="1" />
  </div>
  
  <script type="module">
    window.addEventListener('DOMContentLoaded', () => {
      import('./js/ui-controller.js').catch(e => console.error('Failed to load UI controller:', e));
    });
  </script>
</body>

</html>
