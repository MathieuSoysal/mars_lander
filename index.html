<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mars Lander Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mars Lander Viewer</h1>
    <div class="controls">
      <div class="auto-scroll-controls">
        <button id="auto-scroll" class="control-button">
          <span class="play-icon">▶</span>
          <span class="pause-icon hidden">⏸</span>
        </button>
        <div class="speed-control">
          <label for="speed">Vitesse:</label>
          <input type="range" id="speed" min="1" max="10" value="3">
        </div>
      </div>
      <progress id="progress" value="1" max="300"></progress>
    </div>
  </header>

  <div class="viewer-container">
    <img id="viewer" src="all_svg/output0.svg" alt="Mars Lander" />
    <button id="prev" class="nav-button">❮</button>
    <button id="next" class="nav-button">❯</button>
    <div id="counter">1 / 300</div>
    <div id="loader" class="loader hidden"></div>
  </div>

  <div class="seek-container">
    <input type="range" id="seek" min="1" max="300" value="1" />
  </div>

  <script>
    (function(){
      const progress = document.getElementById('progress');
      const seek = document.getElementById('seek');
      const loader = document.getElementById('loader');
      const viewer = document.getElementById('viewer');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const counter = document.getElementById('counter');
      const autoScrollBtn = document.getElementById('auto-scroll');
      const speedControl = document.getElementById('speed');
      const total = 300;
      let current = 0;
      let autoScrollInterval = null;
      let preloadedImages = [];
      let isAutoScrolling = false;

      // Précharger toutes les images
      function preloadImages() {
        loader.classList.remove('hidden');
        let loadedCount = 0;
        
        for (let i = 0; i < total; i++) {
          preloadedImages[i] = new Image();
          preloadedImages[i].src = `all_svg/output${i}.svg`;
          preloadedImages[i].onload = () => {
            loadedCount++;
            progress.value = Math.floor((loadedCount / total) * 100);
            
            if (loadedCount === total) {
              loader.classList.add('hidden');
              show(0, true);
            }
          };
        }
      }

      function show(n, skipPreloadCheck = false) {
        if (!skipPreloadCheck && preloadedImages.length === 0) {
          return; // Attendre que le préchargement soit terminé
        }
        
        current = (n + total) % total;
        counter.textContent = `${current+1} / ${total}`;
        progress.value = current+1;
        seek.value = current+1;
        
        // Utiliser l'image préchargée si disponible
        if (preloadedImages[current]) {
          viewer.src = preloadedImages[current].src;
        } else {
          viewer.src = `all_svg/output${current}.svg`;
        }
      }

      function toggleAutoScroll() {
        if (isAutoScrolling) {
          stopAutoScroll();
        } else {
          startAutoScroll();
        }
      }

      function startAutoScroll() {
        if (autoScrollInterval) clearInterval(autoScrollInterval);
        
        isAutoScrolling = true;
        autoScrollBtn.classList.add('active');
        autoScrollBtn.querySelector('.play-icon').classList.add('hidden');
        autoScrollBtn.querySelector('.pause-icon').classList.remove('hidden');
        
        const speed = 11 - speedControl.value; // Inversé pour que plus grand = plus rapide
        autoScrollInterval = setInterval(() => {
          show(current + 1);
        }, speed * 100);
      }

      function stopAutoScroll() {
        clearInterval(autoScrollInterval);
        autoScrollInterval = null;
        isAutoScrolling = false;
        autoScrollBtn.classList.remove('active');
        autoScrollBtn.querySelector('.play-icon').classList.remove('hidden');
        autoScrollBtn.querySelector('.pause-icon').classList.add('hidden');
      }

      // Événements
      prev.addEventListener('click', () => {
        stopAutoScroll();
        show(current-1);
      });
      
      next.addEventListener('click', () => {
        stopAutoScroll();
        show(current+1);
      });
      
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') {
          stopAutoScroll();
          show(current-1);
        }
        if (e.key === 'ArrowRight') {
          stopAutoScroll();
          show(current+1);
        }
        if (e.key === ' ') { // Espace pour pause/play
          toggleAutoScroll();
          e.preventDefault();
        }
      });
      
      seek.addEventListener('input', () => {
        stopAutoScroll();
        show(seek.value-1);
      });
      
      autoScrollBtn.addEventListener('click', toggleAutoScroll);
      
      speedControl.addEventListener('input', () => {
        if (isAutoScrolling) {
          startAutoScroll(); // Redémarrer avec la nouvelle vitesse
        }
      });

      // Commencer le préchargement au chargement de la page
      window.addEventListener('load', preloadImages);
    })();
  </script>
</body>
</html>
